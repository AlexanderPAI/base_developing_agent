[project]
name = "base-developing-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AlexanderPAI", email = "petrov@backendpages.ru" }
]
requires-python = ">=3.15.0"
dependencies = [
    "ollama>=0.6.3",
    "openrouter>=1.3.84",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
base-developing-agent = "base_developing_agent:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
